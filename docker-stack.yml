version: '3.8'

services:
  db:
    image: ksk6699/capstone-db:latest
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecomm_db
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  backend:
    image: ksk6699/capstone-backend:latest
    environment:
      - APP_ENV=production
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=ecomm_db
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
    networks:
      - app-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure

  nginx:
    image: ksk6699/capstone-nginx:latest
    ports:
      - "80:80"
    networks:
      - app-net
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first
      restart_policy:
        condition: on-failure

volumes:
  db-data:

networks:
  app-net:
    driver: overlay