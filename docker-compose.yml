services:
  backend:
    build:
      context: ./services/backend
    environment:
      - PORT=5000
    networks:
      - app-net

  frontend:
    build:
      context: ./services/frontend
    networks:
      - app-net

  nginx:
    build:
      context: ./services/nginx
    ports:
      - "8085:80"
    depends_on:
      - backend
      - frontend
    networks:
      - app-net

networks:
  app-net:
    driver: bridge