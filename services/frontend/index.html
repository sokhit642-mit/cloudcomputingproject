<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Computing Capstone</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background: #1e293b;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 520px;
      width: 100%;
      text-align: center;
      border: 1px solid #334155;
    }
    h1 { color: #38bdf8; margin-top: 0; font-size: 1.6rem; }
    p { color: #94a3b8; line-height: 1.5; }
    .badge {
      display: inline-block;
      padding: 0.35rem 0.8rem;
      border-radius: 9999px;
      background: #0284c7;
      color: #fff;
      font-size: 0.85rem;
      margin: 0.5rem 0 1.5rem;
    }
    .status-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 1rem;
      text-align: left;
      font-family: monospace;
      color: #4ade80;
      margin-top: 1rem;
      word-break: break-all;
    }
    button {
      background: #38bdf8;
      border: none;
      color: #0f172a;
      padding: 0.75rem 1.5rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: background 0.2s;
    }
    button:hover { background: #0ea5e9; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Cloud Computing Capstone</h1>
    <div class="badge">AWS EC2 • Docker Swarm • Nginx • Jenkins</div>
    <p>Multi-service cluster running behind an Nginx reverse proxy.</p>
    <button onclick="fetchBackend()">Test Load Balancer</button>
    <div class="status-box" id="output">Click button to fetch backend info...</div>
  </div>

  <script>
    async function fetchBackend() {
      const out = document.getElementById('output');
      out.textContent = 'Calling /api/info...';
      try {
        const res = await fetch('/api/info');
        const data = await res.json();
        out.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        out.textContent = 'Error connecting to backend: ' + err.message;
      }
    }
  </script>
</body>
</html>
